name: Publish to NPM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ CRITICAL: setup-node MUST come BEFORE pnpm/action-setup
      # AND registry-url must be set here - this auto-wires NODE_AUTH_TOKEN to ~/.npmrc
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          # ✅ NO cache here - pnpm handles its own cache below

      # ✅ Setup pnpm AFTER node
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.4

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Smart Publish Logic
        # permissions: id-token: write is already set at the top of your file
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          # Get remote version
          REMOTE_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "0.0.0")

          echo "🔍 Checking Versions..."
          echo "📍 Local  : $LOCAL_VERSION"
          echo "🌐 Remote : $REMOTE_VERSION"

          STATUS=$(node -e "
            const local  = '$LOCAL_VERSION'.split('.').map(Number);
            const remote = '$REMOTE_VERSION'.split('.').map(Number);
            let result = 'EQUAL';
            for (let i = 0; i < 3; i++) {
              if (local[i] > (remote[i] || 0)) { result = 'GREATER'; break; }
              if (local[i] < (remote[i] || 0)) { result = 'SMALLER'; break; }
            }
            console.log(result);
          ")

          echo "📊 Status : $STATUS"

          # 🔧 Configure npm to use the GitHub OIDC token for authentication
          # This removes the need for secrets.NPM_TOKEN
          npm config set //registry.npmjs.org/:_authToken ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}

          if [ "$STATUS" == "GREATER" ]; then
            echo "🚀 NEW VERSION DETECTED! Publishing $LOCAL_VERSION..."
            npm publish --provenance --access public --ignore-scripts

          elif [ "$STATUS" == "EQUAL" ]; then
            echo "🛠️ SAME VERSION. Publishing to @dev tag..."
            TIMESTAMP=$(date +%d%b%Y.%I%M%p)
            DEV_VERSION="${LOCAL_VERSION}-dev.${TIMESTAMP}"
            npm version $DEV_VERSION --no-git-tag-version --ignore-scripts
            npm publish --tag dev --provenance --access public --ignore-scripts

          else
            echo "❌ ERROR: Local ($LOCAL_VERSION) < Remote ($REMOTE_VERSION)."
            exit 1
          fi
