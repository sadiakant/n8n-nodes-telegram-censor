name: Publish to NPM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ CRITICAL: setup-node MUST come BEFORE pnpm/action-setup
      # AND registry-url must be set here - this auto-wires NODE_AUTH_TOKEN to ~/.npmrc
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          # ✅ NO cache here - pnpm handles its own cache below

      # ✅ Setup pnpm AFTER node
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.4

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      # ✅ Smart Publish uses npm publish (npm handles registry auth)
      # NODE_AUTH_TOKEN is auto-set by setup-node via registry-url
      - name: Smart Publish Logic
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          REMOTE_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "0.0.0")

          echo "🔍 Checking Versions..."
          echo "📍 Local  : $LOCAL_VERSION"
          echo "🌐 Remote : $REMOTE_VERSION"

          STATUS=$(node -e "
            const local  = '$LOCAL_VERSION'.split('.').map(Number);
            const remote = '$REMOTE_VERSION'.split('.').map(Number);
            let result = 'EQUAL';
            for (let i = 0; i < 3; i++) {
              if (local[i] > (remote[i] || 0)) { result = 'GREATER'; break; }
              if (local[i] < (remote[i] || 0)) { result = 'SMALLER'; break; }
            }
            console.log(result);
          ")

          echo "📊 Status : $STATUS"

          if [ "$STATUS" == "GREATER" ]; then
            echo "🚀 NEW VERSION DETECTED! Publishing $LOCAL_VERSION to @latest..."
            npm publish --provenance --access public --ignore-scripts
            echo "✅ Published $LOCAL_VERSION to @latest"

          elif [ "$STATUS" == "EQUAL" ]; then
            echo "🛠️ SAME VERSION. Publishing to @dev tag..."
            TIMESTAMP=$(date +%d%b%Y.%I%M%p)
            DEV_VERSION="${LOCAL_VERSION}-dev.${TIMESTAMP}"
            npm version $DEV_VERSION --no-git-tag-version --ignore-scripts
            npm publish --tag dev --provenance --access public --ignore-scripts
            echo "✅ Published $DEV_VERSION to @dev"

          else
            echo "❌ ERROR: Local ($LOCAL_VERSION) < Remote ($REMOTE_VERSION). Update package.json version."
            exit 1
          fi
