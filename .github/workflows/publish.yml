name: Publish to NPM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # ✅ PERMISSIONS: This is required for Trusted Publishing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # ✅ REGISTRY-URL: This correctly creates the .npmrc without a bad token
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.4

      # ... (pnpm cache and install steps are fine) ...
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Smart Publish Logic
        # ❌ NO env: NODE_AUTH_TOKEN needed here
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          # ... (your version check logic is fine) ...
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "0.0.0")
          echo "🔍 Checking Versions..."
          echo "📍 Local  : $LOCAL_VERSION"
          echo "🌐 Remote : $REMOTE_VERSION"
          STATUS=$(node -e "const local='$LOCAL_VERSION'.split('.').map(Number); const remote='$REMOTE_VERSION'.split('.').map(Number); let result='EQUAL'; for(let i=0;i<3;i++){if(local[i]>(remote[i]||0)){result='GREATER';break;} if(local[i]<(remote[i]||0)){result='SMALLER';break;}} console.log(result);")
          echo "📊 Status : $STATUS"

          if [ "$STATUS" == "GREATER" ]; then
            echo "🚀 NEW VERSION DETECTED! Publishing $LOCAL_VERSION to @latest..."
            # ✅ PROVENANCE: This triggers OIDC and solves the EOTP error
            npm publish --provenance --access public --ignore-scripts
            echo "✅ Published $LOCAL_VERSION to @latest"

          elif [ "$STATUS" == "EQUAL" ]; then
            # ... (your dev publish logic is fine, just ensure it has --provenance) ...
            echo "🛠️ SAME VERSION. Publishing to @dev tag..."
            TIMESTAMP=$(date +%d%b%Y.%I%M%p)
            DEV_VERSION="${LOCAL_VERSION}-dev.${TIMESTAMP}"
            npm version $DEV_VERSION --no-git-tag-version --ignore-scripts
            npm publish --tag dev --provenance --access public --ignore-scripts
            echo "✅ Published $DEV_VERSION to @dev"

          else
            echo "❌ ERROR: Local ($LOCAL_VERSION) < Remote ($REMOTE_VERSION). Update package.json version."
            exit 1
          fi
