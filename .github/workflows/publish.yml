name: Publish to NPM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.4

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Smart Publish Logic
        run: |
          # 1. Variables setup
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          # Check current version on NPM (0.0.0 if package is new)
          REMOTE_VERSION=$(npm view $PACKAGE_NAME version 2>/dev/null || echo "0.0.0")

          echo "🔍 Checking Versions..."
          echo "📍 Local  : $LOCAL_VERSION"
          echo "🌐 Remote : $REMOTE_VERSION"

          # 2. Version comparison using Node.js
          STATUS=$(node -e "
            const local  = '$LOCAL_VERSION'.split('.').map(Number);
            const remote = '$REMOTE_VERSION'.split('.').map(Number);
            let result = 'EQUAL';
            for (let i = 0; i < 3; i++) {
              if (local[i] > (remote[i] || 0)) { result = 'GREATER'; break; }
              if (local[i] < (remote[i] || 0)) { result = 'SMALLER'; break; }
            }
            console.log(result);
          ")

          echo "📊 Status : $STATUS"

          # 3. Decision Tree
          if [ "$STATUS" == "GREATER" ]; then
            echo "🚀 NEW VERSION DETECTED! Publishing $LOCAL_VERSION to @latest..."
            npm publish --provenance --access public

          elif [ "$STATUS" == "EQUAL" ]; then
            echo "🛠️ SAME VERSION. Publishing to @dev tag..."
            TIMESTAMP=$(date +%d%b%Y.%I%M%p)
            DEV_VERSION="${LOCAL_VERSION}-dev.${TIMESTAMP}"

            npm version $DEV_VERSION --no-git-tag-version
            npm publish --tag dev --provenance --access public
            echo "✅ Published version $DEV_VERSION with tag @dev"

          else
            echo "❌ ERROR: Local version ($LOCAL_VERSION) is LOWER than NPM ($REMOTE_VERSION)."
            echo "Please update version in package.json."
            exit 1
          fi
